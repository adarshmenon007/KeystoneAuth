name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore KeystoneAuth.slnx

      - name: Build
        run: dotnet build KeystoneAuth.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test KeystoneAuth.slnx --no-build --configuration Release --verbosity normal
