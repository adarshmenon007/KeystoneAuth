apiVersion: apps/v1
kind: Deployment
metadata:
  name: keystone-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keystone-api
  template:
    metadata:
      labels:
        app: keystone-api
    spec:
      containers:
        - name: keystone-api
          image: keystone-api:0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: keystone-config
            - secretRef:
                name: keystone-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi